name: Bug report
description: Report a reproducible Architecture Studio problem
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Architecture Studio version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill or command
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Remove client names, project addresses, credentials, and confidential content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
